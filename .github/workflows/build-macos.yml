name: Build macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build .app for macOS
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          brew install ffmpeg
          brew install python-tk@3.11

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Show project structure (debug)
        run: |
          echo "=== Root files ==="
          ls -la
          echo ""
          echo "=== pytranscript.spec ==="
          wc -c pytranscript.spec
          cat pytranscript.spec

      - name: Build .app with PyInstaller
        run: |
          pyinstaller pytranscript.spec --clean --noconfirm
          echo "=== dist/ ==="
          ls -la dist/

      - name: Verify .app exists
        run: |
          if [ ! -d "dist/pytranscript.app" ]; then
            echo "❌ Brak dist/pytranscript.app"
            find dist -maxdepth 3 -type d 2>/dev/null || true
            exit 1
          fi
          echo "✅ Znaleziono .app"

      - name: Sign app (ad-hoc)
        continue-on-error: true
        run: codesign --deep --force --sign - dist/pytranscript.app || true

      - name: Create DMG
        continue-on-error: true
        run: |
          if [ -d "dist/pytranscript.app" ]; then
            hdiutil create -volname "pytranscript" \
              -srcfolder dist/pytranscript.app \
              -ov -format UDZO dist/pytranscript.dmg
          fi

      - name: Upload .app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytranscript-app
          path: dist/pytranscript.app
          retention-days: 30
          if-no-files-found: warn

      - name: Upload DMG (jeśli istnieje)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytranscript-dmg
          path: dist/pytranscript.dmg
          retention-days: 30
          if-no-files-found: ignore